<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Cirurgia Cardíaca & Anestesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --header-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --modal-bg: #ffffff;
            --input-bg: #f8f9fa;
            --border-color: #e0e6ed;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #f5f6fa;
            --text-muted: #b2bec3;
            --card-bg: #1e1e1e;
            --nav-bg: rgba(30, 30, 30, 0.85);
            --header-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --modal-bg: #1e1e1e;
            --input-bg: #2d2d2d;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: var(--header-gradient);
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .top-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-pill {
            text-decoration: none;
            color: var(--text-main);
            background: var(--input-bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .nav-pill:hover {
            transform: translateY(-2px);
            filter: brightness(0.9);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .category-section {
            margin-top: 50px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .category-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .category-title {
            font-size: 1.6rem;
            margin-bottom: 25px;
            display: inline-block;
            padding-bottom: 5px;
            border-bottom: 4px solid var(--cat-color, #333);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: transparent;
            height: 240px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .card:hover .card-inner {
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        
        .card:not(.flipped):hover .card-inner {
            transform: translateY(-6px);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 16px;
            box-sizing: border-box;
        }

        .card-front {
            background-color: var(--card-bg);
            border-top: 5px solid var(--cat-color);
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card-back {
            background-color: var(--cat-color);
            color: #ffffff;
            transform: rotateY(180deg);
            font-size: 1rem;
            font-weight: 400;
            overflow-y: auto;
        }

        .click-hint {
            position: absolute;
            bottom: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-content h2, .modal-content h3 {
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-primary { background: #0984e3; color: white; }
        .btn-danger { background: #d63031; color: white; }
        .btn-secondary { background: #636e72; color: white; }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .manage-list {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-actions">
            <button class="icon-btn" onclick="toggleTheme()">🌓 Tema</button>
            <button class="icon-btn" onclick="openAdminModal()">⚙️ Admin / Editar</button>
        </div>
        <h1>Flashcards MED</h1>
        <p>Revisão Interativa de Cirurgia Cardíaca</p>
    </header>

    <nav class="sticky-nav" id="nav-menu"></nav>

    <main id="app-container"></main>

    <!-- MODAL DE ADMINISTRAÇÃO E EDIÇÃO -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAdminModal()">✕</button>
            <h2>Painel de Gerenciamento</h2>
            
            <div class="form-group">
                <label>GitHub Gist ID</label>
                <input type="text" id="gist-id" placeholder="Cole o ID do seu Gist aqui">
            </div>
            <div class="form-group">
                <label>GitHub Token (Personal Access Token)</label>
                <input type="password" id="gist-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <h3>Adicionar ou Atualizar Cartão</h3>
            <div class="form-group">
                <label>Categoria (Se nova, será criada automaticamente)</label>
                <input type="text" id="card-category" placeholder="Ex: Hemodinâmica">
            </div>
            <div class="form-group">
                <label>Pergunta (Frente)</label>
                <input type="text" id="card-q" placeholder="Ex: O que é pré-carga?">
            </div>
            <div class="form-group">
                <label>Resposta (Verso)</label>
                <textarea id="card-a" rows="3" placeholder="Ex: Volume ventricular..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="clearForm()">Limpar</button>
                <button class="btn btn-primary" onclick="saveCard()">Salvar e Sincronizar (Gist)</button>
            </div>

            <div class="manage-list">
                <h3>Cartões Existentes</h3>
                <div id="existing-cards-list" style="max-height: 200px; overflow-y: auto; margin-top: 10px;">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let dadosFlashcards = {
            "Hemodinâmica": [
                { q: "O que é pré-carga?", a: "Volume/estiramento ventricular no fim da diástole." },
                { q: "O que é pós-carga?", a: "Resistência à ejeção ventricular." }
            ],
            "Circulação Extracorpórea": [
                { q: "Quais os objetivos da CEC?", a: "Manter perfusão sistêmica, oxigenação e remoção de CO₂." }
            ]
        };

        const cores = ['#ff7675', '#0984e3', '#00b894', '#6c5ce7', '#fdcb6e', '#e17055'];

        document.getElementById('gist-id').value = localStorage.getItem('gist_id') || '';
        document.getElementById('gist-token').value = localStorage.getItem('gist_token') || '';

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        function openAdminModal() { 
            renderManageList();
            document.getElementById('admin-modal').classList.add('active'); 
        }
        function closeAdminModal() { document.getElementById('admin-modal').classList.remove('active'); }
        function clearForm() {
            document.getElementById('card-category').value = '';
            document.getElementById('card-q').value = '';
            document.getElementById('card-a').value = '';
        }

        function renderApp() {
            const container = document.getElementById('app-container');
            const navMenu = document.getElementById('nav-menu');
            container.innerHTML = '';
            navMenu.innerHTML = '';

            let colorIndex = 0;

            for (const [categoria, cartoes] of Object.entries(dadosFlashcards)) {
                if (cartoes.length === 0) continue;
                const corAtual = cores[colorIndex % cores.length];
                const idSecao = 'sec-' + colorIndex;
                colorIndex++;

                const navLink = document.createElement('a');
                navLink.href = '#' + idSecao;
                navLink.className = 'nav-pill';
                navLink.textContent = categoria;
                navMenu.appendChild(navLink);

                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = idSecao;
                section.style.setProperty('--cat-color', corAtual);

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = categoria;

                const grid = document.createElement('div');
                grid.className = 'grid';

                cartoes.forEach(cartao => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.onclick = () => cardEl.classList.toggle('flipped');

                    cardEl.innerHTML = `
                        <div class="card-inner">
                            <div class="card-front">
                                ${cartao.q}
                                <span class="click-hint">↻ Tocar para virar</span>
                            </div>
                            <div class="card-back">
                                ${cartao.a}
                            </div>
                        </div>
                    `;
                    grid.appendChild(cardEl);
                });

                section.appendChild(title);
                section.appendChild(grid);
                container.appendChild(section);
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.category-section').forEach(sec => observer.observe(sec));
        }

        function renderManageList() {
            const listContainer = document.getElementById('existing-cards-list');
            listContainer.innerHTML = '';

            for (const [cat, cartoes] of Object.entries(dadosFlashcards)) {
                cartoes.forEach((cartao, index) => {
                    const item = document.createElement('div');
                    item.className = 'manage-item';
                    item.innerHTML = `
                        <span><b>[${cat}]</b> ${cartao.q}</span>
                        <div>
                            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="editCard('${cat}', ${index})">Editar</button>
                            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteCard('${cat}', ${index})">Excluir</button>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });
            }
        }

        function editCard(cat, index) {
            const cartao = dadosFlashcards[cat][index];
            document.getElementById('card-category').value = cat;
            document.getElementById('card-q').value = cartao.q;
            document.getElementById('card-a').value = cartao.a;
            // Remove o antigo para atualizar depois ao salvar
            dadosFlashcards[cat].splice(index, 1);
            if (dadosFlashcards[cat].length === 0) delete dadosFlashcards[cat];
            renderManageList();
        }

        function deleteCard(cat, index) {
            if (confirm('Tem certeza que deseja excluir este cartão?')) {
                dadosFlashcards[cat].splice(index, 1);
                if (dadosFlashcards[cat].length === 0) delete dadosFlashcards[cat];
                renderManageList();
                renderApp();
                syncGist();
            }
        }

        async function saveCard() {
            const cat = document.getElementById('card-category').value.trim();
            const q = document.getElementById('card-q').value.trim();
            const a = document.getElementById('card-a').value.trim();

            if (!cat || !q || !a) {
                alert('Preencha todos os campos!');
                return;
            }

            if (!dadosFlashcards[cat]) dadosFlashcards[cat] = [];
            dadosFlashcards[cat].push({ q, a });

            clearForm();
            renderManageList();
            renderApp();
            await syncGist();
            closeAdminModal();
        }

        async function syncGist() {
            const gistId = document.getElementById('gist-id').value.trim();
            const token = document.getElementById('gist-token').value.trim();

            localStorage.setItem('gist_id', gistId);
            localStorage.setItem('gist_token', token);

            if (gistId && token) {
                try {
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            files: {
                                "flashcards.json": {
                                    content: JSON.stringify(dadosFlashcards, null, 2)
                                }
                            }
                        })
                    });
                    if (response.ok) {
                        console.log('Sincronizado com o Gist com sucesso!');
                    } else {
                        console.error('Erro ao sincronizar com o Gist.');
                    }
                } catch (e) {
                    console.error('Erro de conexão ao tentar salvar no Gist.', e);
                }
            }
        }

        renderApp();
    </script>
</body>
</html>
