<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcards - Cirurgia Cardíaca & Anestesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./vet-heart.png">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --header-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            --modal-bg: #ffffff;
            --input-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --text-glow-light: 0 2px 8px rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #111827;
            --nav-bg: rgba(17, 24, 39, 0.85);
            --header-gradient: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            --modal-bg: #111827;
            --input-bg: #1f2937;
            --border-color: #1f2937;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            --text-glow-light: 0 2px 12px rgba(248, 250, 252, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3, .category-title, header p {
            font-family: 'Outfit', sans-serif;
        }

        header {
            text-align: center;
            padding: 50px 15px 40px;
            background: var(--header-gradient);
            color: white;
            box-shadow: var(--shadow-sm);
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .top-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            margin: 25px auto 0;
            position: relative;
            padding: 0 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .search-icon {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            padding: 10px 15px;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            scrollbar-width: none;
            width: 100%;
        }

        .sticky-nav::-webkit-scrollbar {
            display: none;
        }

        .sticky-nav.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .nav-pill {
            text-decoration: none;
            color: var(--text-main);
            background: var(--input-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .category-section {
            margin-top: 40px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            width: 100%;
        }

        .category-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: inline-block;
            padding-bottom: 4px;
            border-bottom: 4px solid var(--cat-color, #2563eb);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            width: 100%;
            justify-content: center;
        }

        .card {
            background-color: transparent;
            height: 230px;
            perspective: 1200px;
            cursor: pointer;
            position: relative;
            width: 100%;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .card-front {
            background-color: var(--card-bg);
            border-top: 6px solid var(--cat-color);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
        }

        .card-back {
            background-color: var(--cat-color);
            color: #ffffff;
            transform: rotateY(180deg);
            font-size: 0.95rem;
            font-weight: 500;
            overflow-y: auto;
            border: none;
        }

        .click-hint {
            position: absolute;
            bottom: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.8;
        }

        .card-options-container {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 50;
        }

        .card.flipped .card-options-container {
            transform: none; 
        }

        .dots-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
        }

        .dropdown-menu {
            position: absolute;
            top: 32px;
            right: 0;
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 60;
            min-width: 120px;
            opacity: 0;
            transform: scale(0.8) translateY(-10px);
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .dropdown-menu.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .dropdown-item {
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            background: none;
            border: none;
            width: 100%;
            display: block;
        }

        .dropdown-item:hover {
            background: var(--input-bg);
            color: #2563eb;
        }

        .dropdown-item.danger:hover {
            color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--modal-bg);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #475569; color: white; }
        .btn-success { background: #10b981; color: white; }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
        }

        .manage-list {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .admin-category-group {
            margin-bottom: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .admin-category-header {
            background: var(--input-bg);
            padding: 8px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .admin-category-items {
            padding: 8px;
        }

        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="top-actions">
            <button class="icon-btn" onclick="toggleTheme()">🌓 Tema</button>
            <button class="icon-btn" onclick="openAdminModal()">⚙️ Admin</button>
        </div>
        <h1>Flashcards MED</h1>
        <p>Revisão Interativa de Cirurgia Cardíaca</p>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Pesquisar perguntas..." oninput="filterCards()">
        </div>
    </header>

    <nav class="sticky-nav" id="nav-menu"></nav>

    <main id="app-container"></main>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAdminModal()">✕</button>
            <h2>Painel de Gerenciamento</h2>
            
            <div style="background: var(--input-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">Arquivo Local (JSON)</label>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-success" style="flex: 1;" onclick="exportJSON()">📥 Exportar</button>
                    <button class="btn btn-secondary" style="flex: 1;" onclick="document.getElementById('import-file').click()">📤 Importar</button>
                    <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importJSON(event)">
                </div>
            </div>

            <div class="form-group">
                <label>GitHub Gist ID</label>
                <input type="text" id="gist-id" placeholder="Cole o ID do seu Gist aqui">
            </div>
            <div class="form-group">
                <label>GitHub Token</label>
                <input type="password" id="gist-token" placeholder="ghp_xxxxxxxxxxxx">
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <h3 id="form-title-heading" style="font-size: 1.1rem; margin-bottom: 12px;">Adicionar ou Atualizar Cartão</h3>
            <input type="hidden" id="edit-original-cat" value="">
            <input type="hidden" id="edit-original-index" value="">

            <div class="form-group">
                <label>Categoria</label>
                <input type="text" id="card-category" placeholder="Ex: Hemodinâmica">
            </div>
            <div class="form-group">
                <label>Pergunta (Frente)</label>
                <input type="text" id="card-q" placeholder="Ex: O que é pré-carga?">
            </div>
            <div class="form-group">
                <label>Resposta (Verso)</label>
                <textarea id="card-a" rows="3" placeholder="Ex: Volume ventricular..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="clearForm()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveCard()">Salvar Cartão</button>
            </div>

            <div class="manage-list">
                <h3 style="font-size: 1rem;">Cartões Existentes</h3>
                <div id="existing-cards-list" style="max-height: 220px; overflow-y: auto; margin-top: 8px;"></div>
            </div>
        </div>
    </div>

    <script>
        let dadosFlashcards = {
            "Hemodinâmica": [
                { q: "O que é pré-carga?", a: "Volume/estiramento ventricular no fim da diástole." },
                { q: "O que é pós-carga?", a: "Resistência à ejeção ventricular." },
                { q: "O que é contratilidade?", a: "Capacidade intrínseca do miocárdio de gerar força." },
                { q: "Como se calcula o débito cardíaco?", a: "FC × volume sistólico." },
                { q: "Como se calcula o índice cardíaco?", a: "Débito cardíaco / superfície corporal." },
                { q: "Como se calcula a PAM?", a: "Débito cardíaco × resistência vascular sistêmica." },
                { q: "O que diz a lei de Frank-Starling?", a: "Aumento da pré-carga aumenta força de contração até determinado limite." },
                { q: "Qual o efeito do excesso de pré-carga?", a: "Congestão e queda da eficiência cardíaca." },
                { q: "Qual o efeito do aumento da pós-carga?", a: "↑ trabalho ventricular e ↓ volume sistólico." },
                { q: "Qual o efeito do aumento da contratilidade?", a: "↑ volume sistólico e ↓ volume sistólico final." },
                { q: "Quando ocorre a perfusão coronariana do VE?", a: "Ocorre principalmente durante a diástole." },
                { q: "Qual o impacto da taquicardia intensa?", a: "Reduz tempo diastólico → pode reduzir perfusão coronariana." },
                { q: "O que aumenta o consumo miocárdico de O₂?", a: "Aumenta com frequência, contratilidade e tensão da parede." },
                { q: "Do que depende a oferta miocárdica de O₂?", a: "Depende principalmente do fluxo coronariano e conteúdo arterial de O₂." }
            ],
            "Curva Pressão-Volume": [
                { q: "O que ocorre no enchimento ventricular?", a: "Aumento do volume com pequena elevação da pressão." },
                { q: "O que ocorre na contração isovolumétrica?", a: "Pressão aumenta sem alteração do volume." },
                { q: "O que ocorre na ejeção?", a: "Abertura da valva semilunar e redução do volume ventricular." },
                { q: "O que ocorre no relaxamento isovolumétrico?", a: "Queda rápida da pressão sem alteração do volume." },
                { q: "Como se calcula o volume sistólico?", a: "VDF − VSF." },
                { q: "Como se calcula a fração de ejeção?", a: "Volume sistólico / VDF." },
                { q: "Qual o efeito do aumento da pós-carga na curva?", a: "Tende a aumentar VSF e reduzir volume sistólico." },
                { q: "Qual o efeito do aumento da contratilidade na curva?", a: "Reduz VSF e aumenta volume sistólico." }
            ],
            "Circulação Extracorpórea": [
                { q: "Qual a função da CEC?", a: "Substitui temporariamente função cardíaca e pulmonar." },
                { q: "Quais os objetivos da CEC?", a: "Manter perfusão sistêmica, oxigenação e remoção de CO₂." },
                { q: "Qual o caminho do circuito da CEC?", a: "Drenagem venosa → reservatório → bomba → oxigenador → filtro → circulação arterial." },
                { q: "Qual a função da bomba na CEC?", a: "Gera fluxo sistêmico durante ausência de ejeção cardíaca efetiva." },
                { q: "Qual a função do oxigenador?", a: "Realiza troca gasosa." },
                { q: "Qual a função do reservatório?", a: "Recebe sangue venoso e permite controle do volume do circuito." },
                { q: "Quais os efeitos da hemodiluição?", a: "Redução da viscosidade, mas também redução de hematócrito e fatores de coagulação." },
                { q: "O que é o priming?", a: "Solução utilizada para preencher o circuito antes da CEC." },
                { q: "Como deve ser individualizado o fluxo de CEC?", a: "Conforme temperatura, metabolismo, pressão e perfusão tecidual." },
                { q: "A pressão arterial isolada garante perfusão?", a: "Não, pressão arterial isolada não garante perfusão adequada." },
                { q: "O que indica o lactato na CEC?", a: "Marcador importante de inadequação entre oferta e consumo de O₂." },
                { q: "Para que serve avaliar a saturação venosa?", a: "Ajuda a avaliar extração sistêmica de O₂." }
            ],
            "Hipotermia": [
                { q: "Qual o efeito primário da hipotermia?", a: "Reduz metabolismo e consumo de O₂." },
                { q: "Qual o efeito desejado da hipotermia?", a: "Aumentar tolerância à isquemia." },
                { q: "Quais os riscos da hipotermia?", a: "Coagulopatia, arritmias, alteração enzimática e atraso no metabolismo de fármacos." },
                { q: "Qual o risco do reaquecimento rápido?", a: "Pode favorecer hipertermia cerebral e alterações gasométricas." },
                { q: "Como a temperatura deve ser monitorada?", a: "Deve ser monitorada em múltiplos compartimentos quando possível." }
            ],
            "Anticoagulação": [
                { q: "Qual a função da heparina?", a: "Impede coagulação durante a CEC." },
                { q: "Para que serve o ACT?", a: "Utilizado para monitorar efeito anticoagulante durante CEC." },
                { q: "Qual a função da protamina?", a: "Neutraliza heparina após a CEC." },
                { q: "O que o excesso de protamina pode causar?", a: "Também pode prejudicar coagulação e função plaquetária." },
                { q: "Como investigar sangramento pós-CEC?", a: "Investigar simultaneamente causa cirúrgica e coagulopatia." }
            ],
            "Cardioplegia": [
                { q: "Qual o objetivo da cardioplegia?", a: "Induzir parada cardíaca controlada e reduzir consumo de O₂." },
                { q: "Como age a cardioplegia hipercalêmica?", a: "Despolariza membrana e interrompe atividade elétrica." },
                { q: "Do que depende a proteção miocárdica?", a: "Depende de cardioplegia adequada, hipotermia, controle de isquemia e reperfusão." },
                { q: "Qual a vantagem da cardioplegia sanguínea?", a: "Fornece substratos e capacidade tamponante." },
                { q: "O que é a cardioplegia cristalóide?", a: "Solução sem hemácias." },
                { q: "Qual o risco da isquemia prolongada?", a: "Aumenta risco de lesão miocárdica." },
                { q: "Quais os riscos da reperfusão?", a: "Pode gerar espécies reativas de oxigênio, sobrecarga de cálcio e disfunção contrátil." },
                { q: "O que é o 'stunning' miocárdico?", a: "Disfunção contrátil transitória após isquemia/reperfusão, apesar de recuperação da perfusão." }
            ],
            "Saída da CEC": [
                { q: "O que checar antes de separar da CEC (1)?", a: "Corrigir temperatura, corrigir acidose e corrigir eletrólitos." },
                { q: "O que checar antes de separar da CEC (2)?", a: "Garantir ventilação adequada, avaliar ritmo cardíaco e avaliar volemia." },
                { q: "O que checar antes de separar da CEC (3)?", a: "Avaliar função ventricular, avaliar resistência vascular e garantir desareação adequada." }
            ],
            "Hipotensão Pós-CEC": [
                { q: "Quais as causas de hipotensão pós-CEC?", a: "Hipovolemia, vasoplegia, disfunção VE ou VD, arritmia, tamponamento, obstrução mecânica e isquemia miocárdica." }
            ]
        };

        const cores = ['#f43f5e', '#2563eb', '#10b981', '#8b5cf6', '#f59e0b', '#06b6d4'];

        document.getElementById('gist-id').value = localStorage.getItem('gist_id') || '';
        document.getElementById('gist-token').value = localStorage.getItem('gist_token') || '';

        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        let lastScrollTop = 0;
        const navMenuEl = document.getElementById('nav-menu');
        
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                navMenuEl.classList.add('hidden');
            } else {
                navMenuEl.classList.remove('hidden');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        });

        function openAdminModal() { 
            renderManageList();
            document.getElementById('admin-modal').classList.add('active'); 
        }
        function closeAdminModal() { document.getElementById('admin-modal').classList.remove('active'); }
        
        function clearForm() {
            document.getElementById('card-category').value = '';
            document.getElementById('card-q').value = '';
            document.getElementById('card-a').value = '';
            document.getElementById('edit-original-cat').value = '';
            document.getElementById('edit-original-index').value = '';
            document.getElementById('form-title-heading').textContent = 'Adicionar ou Atualizar Cartão';
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dadosFlashcards, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "site-meu-bb.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function (e) {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        dadosFlashcards = parsedData;
                        renderApp();
                        renderManageList();
                        alert("Flashcards importados com sucesso!");
                    } catch (error) {
                        alert("Erro ao ler o arquivo JSON.");
                    }
                };
            }
        }

        function renderApp() {
            const container = document.getElementById('app-container');
            const navMenu = document.getElementById('nav-menu');
            container.innerHTML = '';
            navMenu.innerHTML = '';

            let colorIndex = 0;

            for (const [categoria, cartoes] of Object.entries(dadosFlashcards)) {
                if (cartoes.length === 0) continue;
                const corAtual = cores[colorIndex % cores.length];
                const idSecao = 'sec-' + colorIndex;
                colorIndex++;

                const navLink = document.createElement('a');
                navLink.href = '#' + idSecao;
                navLink.className = 'nav-pill';
                navLink.textContent = categoria;
                navMenu.appendChild(navLink);

                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = idSecao;
                section.style.setProperty('--cat-color', corAtual);

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.textContent = categoria;

                const grid = document.createElement('div');
                grid.className = 'grid';

                cartoes.forEach((cartao, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.setAttribute('data-question', cartao.q.toLowerCase());
                    
                    cardEl.onclick = (e) => {
                        if (!e.target.closest('.card-options-container')) {
                            cardEl.classList.toggle('flipped');
                        }
                    };

                    const safeCatId = categoria.replace(/[^a-zA-Z0-9]/g, '_');

                    cardEl.innerHTML = `
                        <div class="card-inner">
                            <div class="card-options-container">
                                <button class="dots-btn" onclick="toggleCardMenu(event, '${safeCatId}', ${index})" title="Opções">⋮</button>
                                <div class="dropdown-menu" id="menu-${safeCatId}-${index}">
                                    <button class="dropdown-item" onclick="editCardDirect('${categoria.replace(/'/g, "\\'")}', ${index})">✏️ Editar</button>
                                    <button class="dropdown-item danger" onclick="deleteCard('${categoria.replace(/'/g, "\\'")}', ${index})">🗑️ Excluir</button>
                                </div>
                            </div>
                            <div class="card-front">
                                ${cartao.q}
                                <span class="click-hint">↻ Tocar para virar</span>
                            </div>
                            <div class="card-back">
                                ${cartao.a}
                            </div>
                        </div>
                    `;
                    grid.appendChild(cardEl);
                });

                section.appendChild(title);
                section.appendChild(grid);
                container.appendChild(section);
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.category-section').forEach(sec => observer.observe(sec));
        }

        function filterCards() {
            const rawQuery = document.getElementById('search-input').value;
            const query = rawQuery.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
            const sections = document.querySelectorAll('.category-section');

            sections.forEach(section => {
                let hasVisibleCard = false;
                const cards = section.querySelectorAll('.card');

                cards.forEach(card => {
                    const rawQ = card.getAttribute('data-question');
                    const qText = rawQ.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

                    if (qText.includes(query)) {
                        card.style.display = 'block';
                        hasVisibleCard = true;
                    } else {
                        card.style.display = 'none';
                    }
                });

                section.style.display = hasVisibleCard ? 'block' : 'none';
            });
        }

        function toggleCardMenu(event, safeCatId, index) {
            event.stopPropagation();
            
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== `menu-${safeCatId}-${index}`) {
                    menu.classList.remove('active');
                }
            });

            const menu = document.getElementById(`menu-${safeCatId}-${index}`);
            if (menu) {
                menu.classList.toggle('active');
            }
        }

        window.onclick = function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('active'));
        }

        function editCardDirect(cat, index) {
            editCard(cat, index);
            openAdminModal();
        }

        function renderManageList() {
            const listContainer = document.getElementById('existing-cards-list');
            listContainer.innerHTML = '';

            for (const [cat, cartoes] of Object.entries(dadosFlashcards)) {
                if (cartoes.length === 0) continue;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'admin-category-group';

                const groupHeader = document.createElement('div');
                groupHeader.className = 'admin-category-header';
                groupHeader.textContent = cat + ` (${cartoes.length})`;
                groupDiv.appendChild(groupHeader);

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'admin-category-items';

                cartoes.forEach((cartao, index) => {
                    const item = document.createElement('div');
                    item.className = 'manage-item';
                    item.innerHTML = `
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;" title="${cartao.q}">${cartao.q}</span>
                        <div style="display: flex; gap: 4px; flex-shrink: 0;">
                            <button class="btn btn-secondary" style="padding: 3px 6px; font-size: 0.7rem;" onclick="editCard('${cat}', ${index})">Editar</button>
                            <button class="btn btn-danger" style="padding: 3px 6px; font-size: 0.7rem;" onclick="deleteCard('${cat}', ${index})">Excluir</button>
                        </div>
                    `;
                    itemsDiv.appendChild(item);
                });

                groupDiv.appendChild(itemsDiv);
                listContainer.appendChild(groupDiv);
            }
        }

        function editCard(cat, index) {
            const cartao = dadosFlashcards[cat][index];
            document.getElementById('card-category').value = cat;
            document.getElementById('card-q').value = cartao.q;
            document.getElementById('card-a').value = cartao.a;
            
            document.getElementById('edit-original-cat').value = cat;
            document.getElementById('edit-original-index').value = index;
            document.getElementById('form-title-heading').textContent = 'Editando Cartão';
        }

        function deleteCard(cat, index) {
            if (confirm('Deseja excluir este cartão?')) {
                dadosFlashcards[cat].splice(index, 1);
                if (dadosFlashcards[cat].length === 0) delete dadosFlashcards[cat];
                renderManageList();
                renderApp();
                syncGist();
            }
        }

        async function saveCard() {
            const cat = document.getElementById('card-category').value.trim();
            const q = document.getElementById('card-q').value.trim();
            const a = document.getElementById('card-a').value.trim();
            
            const origCat = document.getElementById('edit-original-cat').value;
            const origIndex = document.getElementById('edit-original-index').value;

            if (!cat || !q || !a) {
                alert('Preencha todos os campos!');
                return;
            }

            if (origCat !== "" && origIndex !== "") {
                const idx = parseInt(origIndex);
                if (origCat === cat) {
                    dadosFlashcards[cat][idx] = { q, a };
                } else {
                    dadosFlashcards[origCat].splice(idx, 1);
                    if (dadosFlashcards[origCat].length === 0) delete dadosFlashcards[origCat];
                    
                    if (!dadosFlashcards[cat]) dadosFlashcards[cat] = [];
                    dadosFlashcards[cat].push({ q, a });
                }
            } else {
                if (!dadosFlashcards[cat]) dadosFlashcards[cat] = [];
                dadosFlashcards[cat].push({ q, a });
            }

            clearForm();
            renderManageList();
            renderApp();
            await syncGist();
            closeAdminModal();
        }

        async function syncGist() {
            const gistId = document.getElementById('gist-id').value.trim();
            const token = document.getElementById('gist-token').value.trim();

            localStorage.setItem('gist_id', gistId);
            localStorage.setItem('gist_token', token);

            if (gistId && token) {
                try {
                    await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            files: {
                                "site-meu-bb.json": {
                                    content: JSON.stringify(dadosFlashcards, null, 2)
                                }
                            }
                        })
                    });
                } catch (e) {
                    console.error('Erro ao sincronizar com o Gist', e);
                }
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker registrado com sucesso!'))
                    .catch((err) => console.log('Erro ao registrar Service Worker:', err));
            });
        }

        renderApp();
    </script>
</body>
</html>
